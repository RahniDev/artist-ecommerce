- name: Set up Node.js
  uses: actions/setup-node@v7
  with:
    node-version: 22

- name: CI debug - commit & files
  run: |
    echo "GITHUB_SHA=$GITHUB_SHA"
    git --no-pager show --name-only --pretty=format:'%H %an %ad %s' -1
    echo ""
    echo "Files in frontend:"
    ls -la frontend
    echo ""
    echo "frontend/package.json:"
    sed -n '1,200p' frontend/package.json
    echo ""
    echo "frontend/package-lock.json yaml lines:"
    grep -n '"yaml"' frontend/package-lock.json || true
    grep -n '2.9.0' frontend/package-lock.json || true
    node -v
    npm -v

- name: Install dependencies
  run: npm ci